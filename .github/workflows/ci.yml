name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Verify sqlite-vec loadable extension
        run: node dist/scripts/smoke-vec.js
      - name: Verify published package contents
        # Must go through `npm run` so npm_execpath is set — otherwise the script
        # falls back to a bare executable name and Windows fails.
        run: npm run verify-package
      - run: npm test
